{% extends 'base.html' %}
{% block content %}
<h1 class="mb-3">{{ 'Edit Payment' if payment else 'Add Payment' }}</h1>
<div class="card form-card"><div class="card-body">
<form method="post">
    <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Member</label>
            <select name="member_id" class="form-select" required>
                <option value="">Select a member</option>
                {% for member in members %}
                <option value="{{ member.member_id }}" {% if payment and payment.member_id == member.member_id %}selected{% endif %}>{{ member.first_name }} {{ member.last_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6"><label class="form-label">Payment Date</label><input type="date" name="payment_date" class="form-control" required value="{{ payment.payment_date if payment else today }}"></div>
        <div class="col-md-4"><label class="form-label">Amount</label><input type="number" step="0.01" min="0" name="amount" class="form-control" required value="{{ payment.amount if payment else '' }}"></div>
        <div class="col-md-4"><label class="form-label">Discount</label><input type="number" step="0.01" min="0" name="discount" class="form-control" required value="{{ payment.discount if payment else 0 }}"></div>
        <div class="col-md-4"><label class="form-label">Payment Method</label><input name="payment_method" class="form-control" required value="{{ payment.payment_method if payment else '' }}"></div>
        <div class="col-md-6"><label class="form-label">Payment Status</label><input name="payment_status" class="form-control" required value="{{ payment.payment_status if payment else 'Completed' }}"></div>
        <div class="col-md-6"><label class="form-label">Record Source</label><input name="record_source" class="form-control" required value="{{ payment.record_source if payment else 'Web App' }}"></div>
    </div>
    <div class="mt-4">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('payments') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
</div></div>
{% endblock %}
