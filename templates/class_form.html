{% extends 'base.html' %}
{% block content %}
<h1 class="mb-3">{{ 'Edit Class' if gym_class else 'Add Class' }}</h1>
<div class="card form-card"><div class="card-body">
<form method="post">
    <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Trainer</label>
            <select name="trainer_id" class="form-select" required>
                <option value="">Select a trainer</option>
                {% for trainer in trainers %}
                <option value="{{ trainer.trainer_id }}" {% if gym_class and gym_class.trainer_id == trainer.trainer_id %}selected{% endif %}>{{ trainer.first_name }} {{ trainer.last_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6"><label class="form-label">Class Name</label><input name="class_name" class="form-control" required value="{{ gym_class.class_name if gym_class else '' }}"></div>
        <div class="col-md-4"><label class="form-label">Class Level</label><input name="class_level" class="form-control" required value="{{ gym_class.class_level if gym_class else '' }}"></div>
        <div class="col-md-4"><label class="form-label">Room Name</label><input name="room_name" class="form-control" required value="{{ gym_class.room_name if gym_class else '' }}"></div>
        <div class="col-md-4"><label class="form-label">Capacity</label><input type="number" min="0" name="capacity" class="form-control" required value="{{ gym_class.capacity if gym_class else 10 }}"></div>
        <div class="col-md-6"><label class="form-label">Class Date</label><input type="date" name="class_date" class="form-control" required value="{{ gym_class.class_date if gym_class else today }}"></div>
        <div class="col-md-6"><label class="form-label">Start Time</label><input type="time" name="start_time" class="form-control" required value="{{ gym_class.start_time.strftime('%H:%M') if gym_class else '09:00' }}"></div>
        <div class="col-md-6"><label class="form-label">Record Source</label><input name="record_source" class="form-control" required value="{{ gym_class.record_source if gym_class else 'Web App' }}"></div>
    </div>
    <div class="mt-4">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('classes') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
</div></div>
{% endblock %}
