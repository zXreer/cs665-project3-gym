{% extends 'base.html' %}
{% block content %}
<h1 class="mb-3">{{ 'Edit Trainer' if trainer else 'Add Trainer' }}</h1>
<div class="card form-card"><div class="card-body">
<form method="post">
    <div class="row g-3">
        <div class="col-md-6"><label class="form-label">First Name</label><input name="first_name" class="form-control" required value="{{ trainer.first_name if trainer else '' }}"></div>
        <div class="col-md-6"><label class="form-label">Last Name</label><input name="last_name" class="form-control" required value="{{ trainer.last_name if trainer else '' }}"></div>
        <div class="col-md-6"><label class="form-label">Specialty</label><input name="specialty" class="form-control" required value="{{ trainer.specialty if trainer else '' }}"></div>
        <div class="col-md-6"><label class="form-label">Hire Date</label><input type="date" name="hire_date" class="form-control" required value="{{ trainer.hire_date if trainer else today }}"></div>
        <div class="col-md-6"><label class="form-label">Certification Level</label><input name="certification_level" class="form-control" required value="{{ trainer.certification_level if trainer else '' }}"></div>
        <div class="col-md-6"><label class="form-label">Hourly Rate</label><input type="number" step="0.01" min="0" name="hourly_rate" class="form-control" required value="{{ trainer.hourly_rate if trainer else '' }}"></div>
        <div class="col-md-6"><label class="form-label">Record Source</label><input name="record_source" class="form-control" required value="{{ trainer.record_source if trainer else 'Web App' }}"></div>
    </div>
    <div class="mt-4">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('trainers') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
</div></div>
{% endblock %}
